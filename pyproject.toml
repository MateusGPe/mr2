[project]
name = "registro"
version = "1.3.0"
description = "Sistema de registro de refeições com suporte a autoatendimento (totem), painel administrativo e sincronização com Google Sheets."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Mateus G. Pereira", email = "mateus.pereira@ifsp.edu.br" }
]
dependencies = [
    "gspread>=6.1.2",
    "ttkbootstrap>=1.10.1",
    "xlsxwriter>=3.2.2",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.27.1",
    "sqlalchemy>=2.0.40",
    "opencv-python>=4.13.0.92",
    "pyzbar>=0.1.9",
    "openpyxl>=3.1.5",
    "reportlab>=5.1.0",
    "qrcode>=8.2",
]

[project.scripts]
registro = "registro.launcher:main"
registrar = "registro.gui.registrar.app:main"
painel = "registro.gui.painel.app:main"
autoatendimento = "registro.gui.autoatendimento.app:main"
cards = "registro.cards.app:main"
setup = "registro.gui.setup.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=6.0.0",
    "pyinstaller>=6.19.0",
    "qrcode>=8.2",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports, unused vars, undefined names)
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "LOG",    # flake8-logging
    "S110",   # try-except-pass
    "S112",   # try-except-continue
    "BLE001", # blind-except
    "I",      # isort
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"registro/gui/**" = ["SIM105", "SIM102", "E402", "E731", "E741"]
"scripts/**" = ["SIM105", "I001", "F401", "F841", "E402"]
"tests/**" = ["BLE001", "S110", "SIM105", "F841"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.coverage.run]
source = ["registro/nucleo"]
omit = [
    "*/__main__.py",
]

[tool.pyright]
include = ["registro/nucleo", "registro/cards"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
