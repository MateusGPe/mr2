[project]
name = "registro"
version = "0.7.1"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Mateus G. Pereira", email = "mateus.pereira@ifsp.edu.br" }
]
dependencies = [
    "peewee>=3.17.6",
    "gspread>=6.1.2",
    "ttkbootstrap>=1.10.1",
    "xlsxwriter>=3.2.2",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.27.1",
    "sqlalchemy>=2.0.40",
    "rich>=14.2.0",
    "questionary>=2.1.1",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "regex>=2025.11.3",
    "opencv-python>=4.13.0.92",
    "pyzbar>=0.1.9",
    "pyinstaller>=6.19.0",
]

[project.scripts]
registrar = "registro.gui.app_registro:main"
painel = "registro.app_principal:main"
autoatendimento = "registro.janela_self_service:main"

[dependency-groups]
dev = [
    "qrcode>=8.2",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.coverage.run]
source = ["registro/nucleo"]
omit = [
    "*/__main__.py",
]